name: Scrape Senate PTRs

on:
  # Automatic runs paused: Senate eFD rejects hosted requests with HTTP 403.
  # Resume scheduling only after source access has been restored and verified.
  workflow_dispatch:
    inputs:
      start_date:
        description: "Override start date (YYYY-MM-DD). Leave blank to use the script default."
        required: false
        default: ""
      end_date:
        description: "Override end date (YYYY-MM-DD). Leave blank to use today."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: senate-ptr-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # A recovery run may have an older triggering SHA; use current data.
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Senate PTR scraper
        env:
          SENATE_PTR_START_DATE: ${{ github.event.inputs.start_date }}
          SENATE_PTR_END_DATE: ${{ github.event.inputs.end_date }}
        run: python scripts/scrape_senate_ptrs.py

      - name: Commit and push updated data
        id: commit
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update Senate PTR data ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify sean-data-portfolio to rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "SITE_DISPATCH_TOKEN secret not set - skipping site rebuild dispatch."
            exit 0
          fi

          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            https://api.github.com/repos/StrokeOfLuck/sean-data-portfolio/dispatches \
            -d '{"event_type": "senate-data-updated"}'
