name: Scraper regression checks

on:
  pull_request:
  push:
    branches: [main, 'fix/**']
    paths: ['scripts/**', 'tests/**', '.github/**', requirements.txt]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/recover-scrape.test.cjs
