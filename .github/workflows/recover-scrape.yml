name: Recover failed Senate scrape

on:
  # Automatic runs paused: Senate eFD rejects hosted requests with HTTP 403.
  # Resume scheduling only after source access has been restored and verified.
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: recover-senate
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          # Only execute trusted default-branch code in this privileged workflow.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const recover = require('./.github/scripts/recover-scrape.cjs');
            await recover({ github, context, core });
