name: Recover failed Senate scrape

on:
  workflow_run:
    workflows: [Scrape Senate PTRs]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: recover-senate-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # Only execute trusted default-branch code in this privileged workflow.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const recover = require('./.github/scripts/recover-scrape.cjs');
            await recover({ github, context, core });
