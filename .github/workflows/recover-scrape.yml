name: Recover failed Senate scrape

on:
  schedule:
    # Check in the evening, roughly half a day after the daily scrape.
    # The script also enforces at least six hours since the failed run.
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: recover-senate
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Only execute trusted default-branch code in this privileged workflow.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const recover = require('./.github/scripts/recover-scrape.cjs');
            await recover({ github, context, core });
